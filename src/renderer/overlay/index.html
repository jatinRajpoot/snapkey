<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self';"
    />
    <title>Snapkey capture</title>
    <link rel="stylesheet" href="/src/renderer/shared/theme.css" />
    <link rel="stylesheet" href="/src/renderer/shared/toolbar.css" />
    <link rel="stylesheet" href="/src/renderer/overlay/overlay.css" />
  </head>
  <body class="overlay-body">
    <div class="stage" id="stage">
      <canvas id="frozen" class="frozen" aria-hidden="true"></canvas>
      <div class="scrim" id="scrim" aria-hidden="true"></div>
      <div class="cutout" id="cutout" aria-hidden="true"></div>
      <canvas id="live" class="live" aria-hidden="true"></canvas>
      <div class="handles" id="handles" aria-hidden="true"></div>
    </div>

    <div class="chrome" id="chrome" hidden>
      <div class="size-badge" id="sizeBadge">
        <span id="sizeText">0 × 0</span>
        <button class="sizer" id="sizer" type="button" title="Toggle size readout  ·  I"></button>
      </div>

      <div class="hint-strip" id="hints">
        <div class="hint">
          <span class="kbd">Space</span>
          <span>Annotate</span>
        </div>
        <div class="hint">
          <span class="kbd">Enter</span>
          <span>Copy</span>
        </div>
        <div class="hint">
          <span class="kbd">F</span>
          <span>Full screen</span>
        </div>
        <div class="hint">
          <span class="kbd">Esc</span>
          <span>Cancel</span>
        </div>
      </div>

      <div class="mode-badge" id="modeBadge" hidden>
        <span class="dot" id="modeDot"></span>
        <span id="modeText">Selecting</span>
      </div>

      <div class="zoom-panel" id="zoomPanel" hidden>
        <canvas id="zoomSource" width="112" height="112"></canvas>
        <div class="zoom-coords" id="zoomCoords">0, 0</div>
      </div>

      <div class="mouse-coords" id="mouseCoords">0, 0</div>
      <div class="toast-stack" id="toasts" aria-live="polite"></div>
    </div>

    <div class="text-editor" id="textEditor" hidden>
      <textarea id="textInput" spellcheck="false" rows="1"></textarea>
    </div>

    <script type="module" src="/src/renderer/overlay/overlay.js"></script>
  </body>
</html>
